<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Drop & View 1.3</title>

<link rel="stylesheet" href="css/style.css">

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

</head>


<body>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

  <div class="drop-card">

    <div class="logo">
      DROP & VIEW
    </div>

    <div class="drop-title">
      Drop your 3D model here
    </div>

    <div class="drop-subtitle">
      or choose a file from your device
    </div>

    <button
      class="open-button"
      id="openButton">
      Open model
    </button>

    <input
      id="fileInput"
      type="file"
      accept=".glb,.gltf,.fbx"
      hidden>

    <div class="formats">
      GLB · GLTF · FBX
    </div>

    <div class="local-note">
      Local only · Nothing is uploaded
    </div>

  </div>

</div>



<!-- =====================================================
     VIEWER UI
===================================================== -->

<div id="viewerUI">

  <div id="topbar">

    <button
      class="brand"
      id="openAgain">
      DROP & VIEW
    </button>


    <div class="style-toolbar">

      <button
        class="tool-button active"
        data-mode="original">
        Original
      </button>

      <button
        class="tool-button"
        data-mode="white">
        White
      </button>

      <button
        class="tool-button"
        data-mode="hidden">
        Hidden
      </button>

      <button
        class="tool-button"
        data-mode="wireframe">
        Wire
      </button>

      <button
        class="tool-button"
        data-mode="renaissance">
        B/W
      </button>

    </div>


    <div class="view-toolbar">

      <button
        class="tool-button active"
        id="perspectiveButton">
        Perspective
      </button>

      <button
        class="tool-button"
        id="axonButton">
        Axonometry
      </button>

      <button
        class="tool-button red"
        id="sectionButton">
        Section
      </button>

    </div>

    <button
      class="tool-button controls-button"
      id="panelButton">
      Controls
    </button>

  </div>



  <!-- ===================================================
       CONTROLS
  =================================================== -->

  <div
    id="sidePanel"
    class="hidden">


    <div
      id="lightSection"
      class="panel-section">

      <div class="panel-title">
        Light
      </div>


      <div class="row">

        <label>
          Sun direction
        </label>

        <input
          id="sunAngle"
          type="range"
          min="0"
          max="360"
          value="45">

      </div>


      <div class="row">

        <label>
          Sun height
        </label>

        <input
          id="sunHeight"
          type="range"
          min="5"
          max="85"
          value="45">

      </div>


      <div class="row">

        <label>
          Shadows
        </label>

        <input
          id="shadowToggle"
          type="checkbox"
          checked>

      </div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Section
      </div>


      <div class="axis-buttons">

        <button
          data-axis="x">
          X
        </button>

        <button
          data-axis="y"
          class="active">
          Y
        </button>

        <button
          data-axis="z">
          Z
        </button>

      </div>


      <div class="row">

        <label>
          Position
        </label>

        <input
          id="sectionSlider"
          type="range"
          min="0"
          max="1000"
          value="500">

      </div>


      <div class="row">

        <label>
          Flip
        </label>

        <input
          id="sectionFlip"
          type="checkbox">

      </div>


      <div class="row color-row">
        <label>Cut color</label>
        <div class="section-colors" role="group" aria-label="Cut color">
          <button type="button" class="color-swatch" data-section-color="#000000" style="--swatch:#000000" aria-label="Black"></button>
          <button type="button" class="color-swatch" data-section-color="#007aff" style="--swatch:#007aff" aria-label="Blue"></button>
          <button type="button" class="color-swatch" data-section-color="#a2845e" style="--swatch:#a2845e" aria-label="Brown"></button>
          <button type="button" class="color-swatch" data-section-color="#32ade6" style="--swatch:#32ade6" aria-label="Cyan"></button>
          <button type="button" class="color-swatch" data-section-color="#34c759" style="--swatch:#34c759" aria-label="Green"></button>
          <button type="button" class="color-swatch" data-section-color="#5856d6" style="--swatch:#5856d6" aria-label="Indigo"></button>
          <button type="button" class="color-swatch" data-section-color="#ff9500" style="--swatch:#ff9500" aria-label="Orange"></button>
          <button type="button" class="color-swatch" data-section-color="#ff2d55" style="--swatch:#ff2d55" aria-label="Pink"></button>
          <button type="button" class="color-swatch" data-section-color="#af52de" style="--swatch:#af52de" aria-label="Purple"></button>
          <button type="button" class="color-swatch active" data-section-color="#ff3b30" style="--swatch:#ff3b30" aria-label="Red"></button>
          <button type="button" class="color-swatch" data-section-color="#ffffff" style="--swatch:#ffffff" aria-label="White"></button>
          <button type="button" class="color-swatch" data-section-color="#ffcc00" style="--swatch:#ffcc00" aria-label="Yellow"></button>
        </div>
      </div>

      <div class="row hidden-section-control">

        <label>
          Section Debug
        </label>

        <input
          id="sectionDebug"
          type="checkbox">

      </div>

      <div class="row hidden-section-control">

        <label>
          Fill cut
        </label>

        <input
          id="sectionFill"
          type="checkbox">

      </div>


      <div
        id="sectionDebugStats"
        class="section-debug-stats hidden-section-control">
      </div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Model
      </div>

      <div id="modelStats"></div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Materials
      </div>

      <div
        id="materialList"
        class="material-list">
      </div>

    </div>


    <div class="navigation-hint">
      Drag to orbit · scroll/pinch to zoom
    </div>

  </div>

</div>


<script type="module" src="js/main.js"></script>

</body>
</html>
