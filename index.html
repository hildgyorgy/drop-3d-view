<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Drop & View</title>
    <link rel="icon" type="image/png" sizes="1024x1024" href="./icon.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      // Safari can render difference-blended labels white over the WebGL canvas.
      // js/ui/adaptive-contrast.js samples the canvas for its fallback colours.
      const browserUA = navigator.userAgent;
      if (
        /AppleWebKit/i.test(browserUA) &&
        /Safari/i.test(browserUA) &&
        !/(Chrome|Chromium|CriOS|Edg|EdgiOS|OPR|FxiOS)/i.test(browserUA)
      ) {
        document.documentElement.classList.add("safari-contrast-fallback");
      }
    </script>
    <link rel="stylesheet" href="css/style.css?v=design-credits" />
    <!-- Adaptive overlay labels; remove this link to disable (see README). -->
    <link rel="stylesheet" href="css/adaptive-contrast.css?v=4" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.5/src/index.js",
          "three-mesh-bvh/": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.5/",
          "three-gpu-pathtracer/": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewerUI">
      <header id="topbar">
        <div class="brand">
          <div class="brand-primary">
            <button id="openAgain" title="Open a 3D model">OPEN FILE</button>
            <div class="about-dock">
              <button
                id="aboutButton"
                class="open-dot"
                type="button"
                aria-label="About Drop & View"
                aria-expanded="false"
                aria-controls="aboutMenu"
                title="About Drop & View"
              >
                <span aria-hidden="true">i</span>
              </button>
              <div
                id="aboutMenu"
                class="about-menu"
                role="group"
                aria-label="About Drop & View"
                hidden
              >
                <div>DROP &amp; VIEW</div>
                <div>by</div>
                <div>GYÖRGY HILD</div>
                <div id="designCreditsBlock" class="design-credits" hidden>
                  <span class="design-credits-heading">Design credits</span>
                  <span id="designCreditsText" class="design-credits-text"></span>
                </div>
                <a
                  href="https://hildgyorgy.github.io/app-support/drop-view/"
                  target="_blank"
                  rel="noopener"
                  >SUPPORT</a
                >
              </div>
            </div>
          </div>
          <div class="navigation-status">
            <div
              id="navigationMode"
              class="navigation-mode"
              role="group"
              aria-label="Camera navigation mode"
            >
              <button
                type="button"
                class="active"
                data-navigation-mode="orbit"
                aria-pressed="true"
                title="Current orbit navigation"
              >
                ORBIT
              </button>
              <button
                type="button"
                data-navigation-mode="fly"
                aria-pressed="false"
                title="Start free flight; click to pause/resume, WASD/arrows move, E/Q change height, Shift speeds up, Escape releases the pointer"
              >
                FLY
              </button>
            </div>
            <output id="performanceStats">-- FPS • --.- ms</output>
          </div>
        </div>
        <nav class="style-toolbar" aria-label="Display style">
          <div class="original-mode">
            <button
              class="tool-button active"
              data-mode="original"
              aria-pressed="true"
            >
              ORIGINAL
            </button>
            <button
              class="photo-button"
              id="photo1Button"
              type="button"
              aria-pressed="false"
              title="Progressive path tracing"
              disabled
            >
              PATH TRACER
            </button>
          </div>
          <button class="tool-button" data-mode="white" aria-pressed="false">
            WHITE
          </button>
          <button class="tool-button" data-mode="hidden" aria-pressed="false">
            HIDDEN
          </button>
          <button class="tool-button" data-mode="wireframe" aria-pressed="false">
            WIRE
          </button>
          <button class="tool-button" data-mode="renaissance" aria-pressed="false">
            B&W
          </button>
        </nav>
        <div class="view-dock">
          <nav class="view-toolbar" aria-label="Camera projection">
            <button
              class="tool-button active"
              id="perspectiveButton"
              aria-pressed="true"
              title="Perspective"
            >
              PERSP
            </button>
            <button
              class="tool-button"
              id="axonButton"
              aria-pressed="false"
              title="Axonometry"
            >
              AXON
            </button>
            <button
              class="tool-button"
              id="orthoButton"
              aria-pressed="false"
              aria-expanded="false"
              aria-controls="orthoMenu"
              title="Orthogonal views"
            >
              ORTHO
            </button>
          </nav>
          <div
            id="orthoMenu"
            class="corner-menu view-menu"
            hidden
            role="group"
            aria-label="Orthogonal view"
          >
            <button data-view="top" aria-pressed="false">TOP</button>
            <button data-view="front" class="active" aria-pressed="true">FRONT</button>
            <button data-view="left" aria-pressed="false">LEFT</button>
            <button data-view="right" aria-pressed="false">RIGHT</button>
            <button data-view="back" aria-pressed="false">BACK</button>
          </div>
        </div>
      </header>

      <div id="startScreen" class="empty-state">
        <div class="empty-state-content">
          <div class="drop-title">DROP YOUR 3D MODEL HERE</div>
          <div class="drop-subtitle">GLB • FBX • GLTF</div>
          <button class="demo-button" id="demoButton" type="button">
            OR TRY THIS <span>DEMO</span> FIRST
          </button>
          <div id="startMessage" class="privacy-note" role="status" aria-live="polite">
            NOTHING IS UPLOADED — YOUR FILE STAYS IN YOUR BROWSER
          </div>
        </div>
      </div>
      <input id="fileInput" type="file" accept="*/*" hidden />

      <div class="controls-dock">
        <div id="sidePanel" class="corner-menu" hidden>
          <div id="lightSection">
            <label class="slider-control" for="sunAngle"
              ><span class="adaptive-text">SUN DIRECTION</span>
              <input id="sunAngle" type="range" min="0" max="360" step="any" value="45" />
            </label>
            <label class="slider-control" for="sunHeight"
              ><span class="adaptive-text">SUN HEIGHT</span>
              <input id="sunHeight" type="range" min="5" max="85" step="any" value="45" />
            </label>
          </div>
          <label class="slider-control" for="cameraFov"
            ><span class="adaptive-text">CAMERA FOV</span>
            <input id="cameraFov" type="range" min="35" max="60" value="42" />
          </label>
          <label class="slider-control" for="transparency"
            ><span class="adaptive-text">TRANSPARENCY</span>
            <input id="transparency" type="range" min="30" max="85" value="68" />
          </label>
          <label class="slider-control" for="flySpeed"
            ><span class="adaptive-text">FLY SPEED</span>
            <input id="flySpeed" type="range" min="10" max="50" value="30" disabled />
          </label>
          <div class="lighting-toggles" role="group" aria-label="Lighting options">
            <label class="check-control" for="shadowToggle"
              ><input id="shadowToggle" type="checkbox" checked />
              <span class="adaptive-text">SHADOW</span></label
            >
            <button
              id="environmentToggle"
              class="check-control check-toggle"
              type="button"
              aria-pressed="false"
              title="Environment lighting in ORIGINAL mode"
            >
              <span class="toggle-dot" aria-hidden="true"></span
              ><span class="adaptive-text">ENV LIGHT</span>
            </button>
            <button
              id="aoToggle"
              class="check-control check-toggle"
              type="button"
              aria-pressed="false"
              title="Ambient occlusion in ORIGINAL mode"
            >
              <span class="toggle-dot" aria-hidden="true"></span
              ><span class="adaptive-text">AMBIENT</span>
            </button>
          </div>
        </div>
        <button
          id="panelButton"
          class="menu-toggle"
          aria-expanded="false"
          aria-controls="sidePanel"
        >
          CONTROLS <span class="menu-arrow" aria-hidden="true"></span>
        </button>
      </div>

      <div class="section-dock">
        <div
          id="sectionMenu"
          class="corner-menu section-menu"
          hidden
          role="group"
          aria-label="Section controls"
        >
          <div class="axis-buttons" role="group" aria-label="Section axis">
            <button data-axis="x" aria-pressed="false">X</button>
            <button data-axis="y" class="active" aria-pressed="true">Y</button>
            <button data-axis="z" aria-pressed="false">Z</button>
          </div>
          <div
            class="section-color-control"
            role="group"
            aria-label="Section edge colour"
          >
            <div class="section-control-label adaptive-text">COLOR</div>
            <div class="section-colors">
              <button
                data-section-color="#ff3b30"
                class="active"
                style="--swatch: #ff3b30"
                aria-label="Red"
                aria-pressed="true"
              ></button>
              <button
                data-section-color="#007aff"
                style="--swatch: #007aff"
                aria-label="Blue"
                aria-pressed="false"
              ></button>
              <button
                data-section-color="#34c759"
                style="--swatch: #34c759"
                aria-label="Green"
                aria-pressed="false"
              ></button>
              <button
                data-section-color="#ffcc00"
                style="--swatch: #ffcc00"
                aria-label="Yellow"
                aria-pressed="false"
              ></button>
              <button
                data-section-color="#000000"
                style="--swatch: #000000"
                aria-label="Black"
                aria-pressed="false"
              ></button>
              <button
                data-section-color="#ffffff"
                style="--swatch: #ffffff"
                aria-label="White"
                aria-pressed="false"
              ></button>
            </div>
          </div>
          <label class="slider-control section-plane-control" for="sectionSlider"
            ><span class="adaptive-text">PLANE</span>
            <input
              id="sectionSlider"
              type="range"
              min="0"
              max="1000"
              value="500"
              aria-label="Section plane position"
            />
          </label>
        </div>
        <div class="section-heading">
          <button
            id="sectionMenuButton"
            class="menu-toggle"
            aria-expanded="false"
            aria-controls="sectionMenu"
          >
            <span class="menu-arrow" aria-hidden="true"></span>SECTION
          </button>
          <button
            id="sectionButton"
            class="circle-toggle"
            aria-label="Enable section"
            aria-pressed="false"
          ></button>
        </div>
      </div>

      <div class="model-dock">
        <button
          id="showAllButton"
          class="menu-toggle"
          title="Fit the whole model in the current view"
          hidden
        >
          SHOW ALL
        </button>
        <div class="groups-dock">
          <div
            id="groupMenu"
            class="corner-menu group-menu"
            hidden
            role="group"
            aria-label="Model groups"
          >
            <div class="group-filter-actions">
              <button id="showAllGroupsButton" type="button">ALL ON</button>
              <button id="hideAllGroupsButton" type="button">ALL OFF</button>
            </div>
            <div id="groupList" class="group-filter-list"></div>
          </div>
          <button
            id="groupMenuButton"
            class="menu-toggle"
            aria-expanded="false"
            aria-controls="groupMenu"
            hidden
          >
            GROUPS <span class="menu-arrow" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Retained for later UI iterations. Inspector work pauses while hidden. -->
      <div id="retainedControls" hidden>
        <button id="openButton">OPEN FILE</button>
        <input id="sectionFlip" type="checkbox" />
        <input id="sectionDebug" type="checkbox" />
        <input id="sectionFill" type="checkbox" />
        <div id="sectionDebugStats"></div>
        <section>
          <h2>Model</h2>
          <div id="modelStats"></div>
        </section>
        <section>
          <h2>Materials</h2>
          <div id="materialList" class="material-list"></div>
        </section>
        <section>
          <h2>Element types</h2>
          <div id="elementTypeList" class="element-type-list"></div>
        </section>
      </div>
    </div>
    <script type="module" src="js/main.js?v=safari-contrast-sampling"></script>
  </body>
</html>
