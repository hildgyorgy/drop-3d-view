<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Drop & View 1.3</title>

<style>
:root {
  --bg: #efefed;
  --panel: rgba(255,255,255,.90);
  --text: #171717;
  --muted: #777;
  --line: rgba(0,0,0,.12);
  --red: #e32620;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

button,
input,
select {
  font: inherit;
}

button {
  border: 0;
}

canvas {
  display: block;
  touch-action: none;
}


/* ======================================================
   START SCREEN
====================================================== */

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: grid;
  place-items: center;

  background: var(--bg);

  transition:
    opacity .35s ease,
    visibility .35s ease;
}

#startScreen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.drop-card {
  width: min(520px, calc(100vw - 40px));
  padding: 42px 34px;

  text-align: center;

  border: 1px solid var(--line);
  border-radius: 18px;

  background: rgba(255,255,255,.55);

  transition:
    transform .15s ease,
    background .15s ease;
}

body.dragging .drop-card {
  transform: scale(1.015);
  background: white;
}

.logo {
  margin-bottom: 42px;

  font-size: 13px;
  font-weight: 700;
  letter-spacing: .18em;
}

.drop-title {
  margin-bottom: 12px;

  font-size: clamp(28px,5vw,44px);
  line-height: 1.03;
  letter-spacing: -.04em;
}

.drop-subtitle {
  margin-bottom: 28px;

  color: var(--muted);
  font-size: 15px;
}

.open-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 150px;
  height: 46px;

  padding: 0 22px;

  border-radius: 23px;

  background: #111;
  color: white;

  cursor: pointer;
}

.open-button:hover {
  opacity: .82;
}

.formats {
  margin-top: 22px;

  font-size: 12px;
  letter-spacing: .08em;
  color: #888;
}

.local-note {
  margin-top: 28px;

  font-size: 12px;
  color: #999;
}


/* ======================================================
   VIEWER UI
====================================================== */

#viewerUI {
  position: fixed;
  inset: 0;
  z-index: 20;

  pointer-events: none;
}

#topbar {
  position: absolute;

  top: 16px;
  left: 16px;
  right: 16px;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  pointer-events: none;
}

.brand,
.toolbar,
.panel {
  pointer-events: auto;
}

.brand {
  padding: 10px 14px;

  border-radius: 10px;

  background: var(--panel);
  backdrop-filter: blur(14px);

  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;

  gap: 5px;

  max-width: min(800px,75vw);
}

.tool-button {
  min-height: 36px;

  padding: 0 12px;

  border-radius: 8px;

  background: var(--panel);
  backdrop-filter: blur(14px);

  cursor: pointer;

  color: #222;
}

.tool-button:hover {
  background: white;
}

.tool-button.active {
  background: #111;
  color: white;
}

.tool-button.red.active {
  background: var(--red);
}


/* ======================================================
   SIDE PANEL
====================================================== */

#sidePanel {
  position: absolute;

  top: 66px;
  right: 16px;

  width: 280px;
  max-height: calc(100vh - 100px);

  overflow: auto;

  padding: 15px;

  border-radius: 12px;

  background: var(--panel);
  backdrop-filter: blur(16px);

  pointer-events: auto;

  transition:
    opacity .2s ease,
    transform .2s ease;
}

#sidePanel.hidden {
  opacity: 0;
  transform: translateX(12px);
  pointer-events: none;
}

.panel-section + .panel-section {
  border-top: 1px solid var(--line);

  margin-top: 15px;
  padding-top: 15px;
}

.panel-title {
  margin-bottom: 10px;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: .1em;
  text-transform: uppercase;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin: 8px 0;

  font-size: 13px;
}

.row label {
  color: #555;
}

.row input[type="range"] {
  width: 145px;
}

.axis-buttons {
  display: grid;
  grid-template-columns: repeat(3,1fr);

  gap: 5px;
}

.axis-buttons button {
  padding: 8px;

  border-radius: 6px;

  cursor: pointer;

  background: #ddd;
}

.axis-buttons button.active {
  background: var(--red);
  color: white;
}

.model-stat {
  display: flex;
  justify-content: space-between;

  padding: 3px 0;

  font-size: 12px;
}

.material-list {
  max-height: 180px;
  overflow: auto;
}

.material-item {
  padding: 4px 0;

  border-bottom: 1px solid rgba(0,0,0,.05);

  font-size: 11px;
}

.section-debug-stats {
  margin-top: 10px;
  padding: 9px 10px;

  border-radius: 6px;

  background: rgba(0,0,0,.045);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  font-size: 10px;
  line-height: 1.55;
  color: #444;
}

.section-debug-stats:empty {
  display: none;
}


/* ======================================================
   STATUS
====================================================== */

#status {
  position: absolute;

  left: 16px;
  bottom: 16px;

  max-width: calc(100vw - 32px);

  padding: 9px 12px;

  border-radius: 9px;

  background: var(--panel);
  backdrop-filter: blur(12px);

  font-size: 12px;
  color: #555;

  pointer-events: none;

  transition: opacity .5s;
}


/* ======================================================
   MOBILE
====================================================== */

@media (max-width:720px) {

  #topbar {
    top: max(10px,env(safe-area-inset-top));
    left: 10px;
    right: 10px;
  }

  .brand {
    display: none;
  }

  .toolbar {
    max-width: 100%;
    justify-content: flex-end;
  }

  .tool-button {
    min-height: 34px;

    padding: 0 10px;

    font-size: 12px;
  }

  #sidePanel {
    top: auto;
    left: 10px;
    right: 10px;

    bottom: max(10px,env(safe-area-inset-bottom));

    width: auto;
    max-height: 45vh;
  }

  #status {
    display: none;
  }

}
</style>


<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

</head>


<body>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

  <div class="drop-card">

    <div class="logo">
      DROP & VIEW
    </div>

    <div class="drop-title">
      Drop your 3D model here
    </div>

    <div class="drop-subtitle">
      or choose a file from your device
    </div>

    <button
      class="open-button"
      id="openButton">
      Open model
    </button>

    <input
      id="fileInput"
      type="file"
      accept=".glb,.gltf,.fbx"
      hidden>

    <div class="formats">
      GLB · GLTF · FBX
    </div>

    <div class="local-note">
      Local only · Nothing is uploaded
    </div>

  </div>

</div>



<!-- =====================================================
     VIEWER UI
===================================================== -->

<div id="viewerUI">

  <div id="topbar">

    <div class="brand">
      DROP & VIEW
    </div>


    <div class="toolbar">

      <button
        class="tool-button"
        id="openAgain">
        Open
      </button>

      <button
        class="tool-button active"
        data-mode="original">
        Original
      </button>

      <button
        class="tool-button"
        data-mode="white">
        White
      </button>

      <button
        class="tool-button"
        data-mode="hidden">
        Hidden
      </button>

      <button
        class="tool-button"
        data-mode="wireframe">
        Wire
      </button>

      <button
        class="tool-button"
        data-mode="renaissance">
        B/W
      </button>

      <button
        class="tool-button"
        id="cameraButton">
        Axon
      </button>

      <button
        class="tool-button red"
        id="sectionButton">
        Section
      </button>

      <button
        class="tool-button"
        id="panelButton">
        Controls
      </button>

    </div>

  </div>



  <!-- ===================================================
       CONTROLS
  =================================================== -->

  <div
    id="sidePanel"
    class="hidden">


    <div class="panel-section">

      <div class="panel-title">
        Light
      </div>


      <div class="row">

        <label>
          Sun direction
        </label>

        <input
          id="sunAngle"
          type="range"
          min="0"
          max="360"
          value="45">

      </div>


      <div class="row">

        <label>
          Sun height
        </label>

        <input
          id="sunHeight"
          type="range"
          min="5"
          max="85"
          value="45">

      </div>


      <div class="row">

        <label>
          Shadows
        </label>

        <input
          id="shadowToggle"
          type="checkbox"
          checked>

      </div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Section
      </div>


      <div class="axis-buttons">

        <button
          data-axis="x">
          X
        </button>

        <button
          data-axis="y"
          class="active">
          Y
        </button>

        <button
          data-axis="z">
          Z
        </button>

      </div>


      <div class="row">

        <label>
          Position
        </label>

        <input
          id="sectionSlider"
          type="range"
          min="0"
          max="1000"
          value="500">

      </div>


      <div class="row">

        <label>
          Flip
        </label>

        <input
          id="sectionFlip"
          type="checkbox">

      </div>


      <div class="row">

        <label>
          Section Debug
        </label>

        <input
          id="sectionDebug"
          type="checkbox">

      </div>


      <div
        id="sectionDebugStats"
        class="section-debug-stats">
      </div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Model
      </div>

      <div id="modelStats"></div>

    </div>



    <div class="panel-section">

      <div class="panel-title">
        Materials
      </div>

      <div
        id="materialList"
        class="material-list">
      </div>

    </div>

  </div>


  <div id="status">
    Drop or open a model
  </div>

</div>



<script type="module">

/* ======================================================
   IMPORTS
====================================================== */

import * as THREE from "three";

import {
  OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
  FBXLoader
} from "three/addons/loaders/FBXLoader.js";



/* ======================================================
   DOM
====================================================== */

const startScreen =
  document.querySelector("#startScreen");

const openButton =
  document.querySelector("#openButton");

const openAgain =
  document.querySelector("#openAgain");

const fileInput =
  document.querySelector("#fileInput");

const sidePanel =
  document.querySelector("#sidePanel");

const panelButton =
  document.querySelector("#panelButton");

const cameraButton =
  document.querySelector("#cameraButton");

const sectionButton =
  document.querySelector("#sectionButton");

const sunAngle =
  document.querySelector("#sunAngle");

const sunHeight =
  document.querySelector("#sunHeight");

const shadowToggle =
  document.querySelector("#shadowToggle");

const sectionSlider =
  document.querySelector("#sectionSlider");

const sectionFlip =
  document.querySelector("#sectionFlip");

const sectionDebug =
  document.querySelector("#sectionDebug");

const sectionDebugStats =
  document.querySelector("#sectionDebugStats");

const statusElement =
  document.querySelector("#status");

const modelStats =
  document.querySelector("#modelStats");

const materialList =
  document.querySelector("#materialList");



/* ======================================================
   SCENE
====================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0xefefed);



/* ======================================================
   RENDERER
====================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    stencil: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1;

renderer.shadowMap.enabled =
  true;

renderer.shadowMap.type =
  THREE.PCFShadowMap;

renderer.localClippingEnabled =
  true;

document.body.appendChild(
  renderer.domElement
);



/* ======================================================
   CAMERAS
====================================================== */

const perspectiveCamera =
  new THREE.PerspectiveCamera(
    42,
    window.innerWidth /
    window.innerHeight,
    .01,
    100000
  );

perspectiveCamera.position.set(
  10,
  8,
  10
);


const orthoCamera =
  new THREE.OrthographicCamera(
    -10,
    10,
    10,
    -10,
    .01,
    100000
  );


let camera =
  perspectiveCamera;

let cameraMode =
  "perspective";



/* ======================================================
   CONTROLS
====================================================== */

let controls =
  createControls(camera);


function createControls(cam) {

  const c =
    new OrbitControls(
      cam,
      renderer.domElement
    );

  c.enableDamping =
    true;

  c.dampingFactor =
    .065;

  c.rotateSpeed =
    .55;

  c.zoomSpeed =
    .8;

  c.panSpeed =
    .7;

  c.screenSpacePanning =
    true;

  c.zoomToCursor =
    true;

  c.minPolarAngle =
    .02;

  c.maxPolarAngle =
    Math.PI * .495;

  return c;

}



/* ======================================================
   LIGHTING
====================================================== */

const DEFAULT_HEMI_INTENSITY =
  1.15;


const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x888888,
    DEFAULT_HEMI_INTENSITY
  );

scene.add(
  hemi
);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3.3
  );

sun.castShadow =
  true;

sun.shadow.mapSize.set(
  8192,
  8192
);

sun.shadow.bias =
  -.0001;

sun.shadow.normalBias =
  .02;

scene.add(
  sun
);

scene.add(
  sun.target
);



/* ======================================================
   MODEL STATE
====================================================== */

let model =
  null;

let modelSize =
  new THREE.Vector3();

let modelCenter =
  new THREE.Vector3();

let modelBounds =
  null;

let maxModelSize =
  10;

let currentObjectURL =
  null;

let currentMode =
  "original";

let sectionEnabled =
  false;

let sectionAxis =
  "y";

let sectionPlane =
  new THREE.Plane(
    new THREE.Vector3(
      0,
      -1,
      0
    ),
    0
  );

let originalMaterials =
  new Map();

let edgeGroup =
  null;

let sectionCapGroup =
  null;

let sectionCapFrame =
  null;

let sectionTriangleComponents =
  new WeakMap();

let sectionTopologyComponentCount =
  0;

let originalCastShadow =
  new Map();

let ground =
  null;



/* ======================================================
   SHARED MATERIALS
====================================================== */


/* ------------------------------------------------------
   WHITE
------------------------------------------------------ */

const whiteMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide
  });



/* ------------------------------------------------------
   WIREFRAME
------------------------------------------------------ */

const wireMaterial =
  new THREE.MeshBasicMaterial({
    color: 0x111111,
    wireframe: true,
    side: THREE.DoubleSide
  });



/* ------------------------------------------------------
   EDGES
------------------------------------------------------ */

const edgeMaterial =
  new THREE.LineBasicMaterial({
    color: 0x111111
  });



/* ------------------------------------------------------
   SECTION CAP
------------------------------------------------------ */

const sectionCapMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xe32620,
    side: THREE.DoubleSide,
    depthWrite: true,
    depthTest: true,
    toneMapped: false
  });


const sectionDebugLineMaterial =
  new THREE.LineBasicMaterial({
    color: 0x00eaff,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });


function createSectionDebugPointMaterial(color) {

  return new THREE.PointsMaterial({
    color,
    size: 6,
    sizeAttenuation: false,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });

}


const sectionDebugDegree2Material =
  createSectionDebugPointMaterial(
    0x20d96b
  );

const sectionDebugDegree1Material =
  createSectionDebugPointMaterial(
    0xff2b2b
  );

const sectionDebugBranchMaterial =
  createSectionDebugPointMaterial(
    0xff00d4
  );



/* ======================================================
   RENAISSANCE / B&W MATERIAL
====================================================== */

/*
   Drop & View 1.1

   FONTOS VÁLTOZÁS:

   A B/W mód most MeshLambertMaterial.

   Így:

   - az eredeti anyagszínek nem számítanak;
   - nincs metallic / roughness / specular;
   - a DirectionalLight N·L világítása működik;
   - a DirectionalLight SHADOW MAP működik;
   - a HemisphereLightot B/W módban kikapcsoljuk.

   Ezután a KÉSZ megvilágítás eredményét
   kvantáljuk tiszta feketére vagy fehérre.

*/


const renaissanceMaterial =
  new THREE.MeshLambertMaterial({

    color: 0xffffff,

    emissive: 0x000000,

    side: THREE.DoubleSide

  });


renaissanceMaterial.onBeforeCompile =
  shader => {

    shader.fragmentShader =
      shader.fragmentShader.replace(

        "#include <dithering_fragment>",

        `

        /*
           Csak két tónus létezhet.

           A direkt napfény + shadow map eredményéből
           készítünk fekete/fehér grafikát.
        */

        float dvLuma =
          dot(
            gl_FragColor.rgb,
            vec3(
              0.2126,
              0.7152,
              0.0722
            )
          );


        /*
           Küszöb.

           Alacsony érték:
           csak az igazi árnyék lesz fekete.

           Magasabb érték:
           grafikusabb, több fekete felület.

           Első próbára 0.24.
        */

        float dvBW =
          step(
            0.24,
            dvLuma
          );


        gl_FragColor =
          vec4(
            vec3(dvBW),
            1.0
          );


        #include <dithering_fragment>

        `

      );

  };


renaissanceMaterial.customProgramCacheKey =
  () => "drop-view-renaissance-1.1";

/* ======================================================
   RENAISSANCE GLASS
====================================================== */

const renaissanceGlassMaterial =
  new THREE.MeshBasicMaterial({

    color: 0xffffff,

    transparent: true,

    opacity: 0.18,

    side: THREE.DoubleSide,

    depthWrite: false,

    toneMapped: false

  });


function isGlassMaterial(material) {

  const name =
    (material?.name || "")
      .toLocaleLowerCase("hu");


  return (

    name.includes("üveg") ||

    name.includes("uveg") ||

    name.includes("glass")

  );

}


function getRenaissanceMaterial(
  original
) {

  if (
    Array.isArray(original)
  ) {

    return original.map(
      material =>
        isGlassMaterial(material)
          ? renaissanceGlassMaterial
          : renaissanceMaterial
    );

  }


  return isGlassMaterial(original)
    ? renaissanceGlassMaterial
    : renaissanceMaterial;

}


function isEntirelyGlass(
  original
) {

  const materials =
    Array.isArray(original)
      ? original
      : [original];


  return (
    materials.length > 0 &&
    materials.every(
      isGlassMaterial
    )
  );

}

/* ======================================================
   OPEN
====================================================== */

openButton.onclick =
openAgain.onclick =
() => {

  fileInput.value =
    "";

  fileInput.click();

};


fileInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];

    if (file)
      openFile(file);

  }
);



/* ======================================================
   DRAG & DROP
====================================================== */

window.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    document.body
      .classList
      .add("dragging");

  }
);


window.addEventListener(
  "dragleave",
  () => {

    document.body
      .classList
      .remove("dragging");

  }
);


window.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    document.body
      .classList
      .remove("dragging");


    const file =
      event.dataTransfer
        .files?.[0];


    if (file)
      openFile(file);

  }
);



/* ======================================================
   OPEN MODEL
====================================================== */

async function openFile(file) {

  disposeCurrentModel();


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  if (
    ![
      "glb",
      "gltf",
      "fbx"
    ].includes(extension)
  ) {

    setStatus(
      "Unsupported file format."
    );

    return;

  }


  setStatus(
    `Opening ${file.name}…`
  );


  startScreen.classList.add(
    "hidden"
  );


  currentObjectURL =
    URL.createObjectURL(file);


  try {

    let object;


    if (
      extension === "glb" ||
      extension === "gltf"
    ) {

      const loader =
        new GLTFLoader();


      const result =
        await loader.loadAsync(
          currentObjectURL
        );


      object =
        result.scene;

    }


    else if (
      extension === "fbx"
    ) {

      const loader =
        new FBXLoader();


      object =
        await loader.loadAsync(
          currentObjectURL
        );

    }


    prepareModel(
      object,
      file
    );

  }


  catch(error) {

    console.error(
      error
    );


    setStatus(
      "The model could not be opened."
    );

  }

}



/* ======================================================
   PREPARE MODEL
====================================================== */

function prepareModel(
  object,
  file
) {

  model =
    object;


  originalMaterials.clear();


  model.traverse(
  node => {

    if (!node.isMesh)
      return;

    node.castShadow =
      true;

    node.receiveShadow =
      true;

    const materials =
      Array.isArray(node.material)
        ? node.material
        : [node.material];

    materials.forEach(material => {

      if (!material)
        return;

      material.side =
        THREE.DoubleSide;

      material.needsUpdate =
        true;

    });

    originalMaterials.set(
      node.uuid,
      node.material
    );

  }
);


  scene.add(
    model
  );


  centreModel();

  buildSectionTopology();

buildEdges();

createGround();


configureSun();

  inspectModel(file);

  fitCamera();


  setViewMode(
    "original"
  );


  setStatus(
    `${file.name} · drag to orbit · scroll/pinch to zoom`
  );

}



/* ======================================================
   SECTION SURFACE TOPOLOGY
====================================================== */

function buildSectionTopology() {

  sectionTriangleComponents =
    new WeakMap();

  sectionTopologyComponentCount =
    0;


  if (!model)
    return;


  model.updateMatrixWorld(
    true
  );


  const tolerance =
    Math.max(
      maxModelSize * 1e-5,
      1e-6
    );


  const meshEntries =
    [];

  let totalTriangles =
    0;


  model.traverse(
    mesh => {

      if (
        !mesh.isMesh ||
        !mesh.geometry?.attributes?.position
      )
        return;


      const geometry =
        mesh.geometry;

      const position =
        geometry.attributes.position;

      const triangleCount =
        geometry.index
        ? Math.floor(
            geometry.index.count / 3
          )
        : Math.floor(
            position.count / 3
          );


      const components =
        new Int32Array(
          triangleCount
        );


      sectionTriangleComponents.set(
        mesh,
        components
      );


      meshEntries.push({
        mesh,
        geometry,
        start: totalTriangles,
        triangleCount,
        components
      });


      totalTriangles +=
        triangleCount;

    }
  );


  const parents =
    new Int32Array(
      totalTriangles
    );

  const ranks =
    new Uint8Array(
      totalTriangles
    );


  for (let i=0; i<totalTriangles; i++)
    parents[i] = i;


  function findRoot(index) {

    let root =
      index;


    while (parents[root] !== root)
      root = parents[root];


    while (parents[index] !== index) {

      const next =
        parents[index];

      parents[index] =
        root;

      index =
        next;

    }


    return root;

  }


  function union(aIndex,bIndex) {

    let aRoot =
      findRoot(aIndex);

    let bRoot =
      findRoot(bIndex);


    if (aRoot === bRoot)
      return;


    if (ranks[aRoot] < ranks[bRoot]) {

      const swap =
        aRoot;

      aRoot =
        bRoot;

      bRoot =
        swap;

    }


    parents[bRoot] =
      aRoot;


    if (ranks[aRoot] === ranks[bRoot])
      ranks[aRoot]++;

  }


  const pointIds =
    new Map();

  const edgeOwners =
    new Map();

  let nextPointId =
    0;


  const worldPoint =
    new THREE.Vector3();


  function getPointId(
    position,
    index,
    matrixWorld
  ) {

    worldPoint
      .fromBufferAttribute(
        position,
        index
      )
      .applyMatrix4(
        matrixWorld
      );


    const key =
      Math.round(worldPoint.x / tolerance) +
      "," +
      Math.round(worldPoint.y / tolerance) +
      "," +
      Math.round(worldPoint.z / tolerance);


    if (pointIds.has(key))
      return pointIds.get(key);


    const pointId =
      nextPointId++;


    pointIds.set(
      key,
      pointId
    );


    return pointId;

  }


  function connectEdge(
    pointA,
    pointB,
    triangleId
  ) {

    if (pointA === pointB)
      return;


    const lo =
      Math.min(pointA,pointB);

    const hi =
      Math.max(pointA,pointB);

    const key =
      lo + ":" + hi;


    if (edgeOwners.has(key)) {

      union(
        triangleId,
        edgeOwners.get(key)
      );

    }

    else {

      edgeOwners.set(
        key,
        triangleId
      );

    }

  }


  for (const entry of meshEntries) {

    const geometry =
      entry.geometry;

    const position =
      geometry.attributes.position;

    const index =
      geometry.index;


    for (
      let triangle=0;
      triangle<entry.triangleCount;
      triangle++
    ) {

      const ia =
        index
        ? index.getX(triangle*3)
        : triangle*3;

      const ib =
        index
        ? index.getX(triangle*3+1)
        : triangle*3+1;

      const ic =
        index
        ? index.getX(triangle*3+2)
        : triangle*3+2;


      const pointA =
        getPointId(
          position,
          ia,
          entry.mesh.matrixWorld
        );

      const pointB =
        getPointId(
          position,
          ib,
          entry.mesh.matrixWorld
        );

      const pointC =
        getPointId(
          position,
          ic,
          entry.mesh.matrixWorld
        );

      const triangleId =
        entry.start + triangle;


      connectEdge(
        pointA,
        pointB,
        triangleId
      );

      connectEdge(
        pointB,
        pointC,
        triangleId
      );

      connectEdge(
        pointC,
        pointA,
        triangleId
      );

    }

  }


  const componentIds =
    new Map();


  for (const entry of meshEntries) {

    for (
      let triangle=0;
      triangle<entry.triangleCount;
      triangle++
    ) {

      const root =
        findRoot(
          entry.start + triangle
        );


      if (!componentIds.has(root)) {

        componentIds.set(
          root,
          sectionTopologyComponentCount++
        );

      }


      entry.components[triangle] =
        componentIds.get(root);

    }

  }

}



/* ======================================================
   CENTRE MODEL
====================================================== */

function centreModel() {

  let box =
    new THREE.Box3()
      .setFromObject(model);


  const centre =
    box.getCenter(
      new THREE.Vector3()
    );


  model.position.x -=
    centre.x;

  model.position.z -=
    centre.z;

  model.position.y -=
    box.min.y;


  model.updateMatrixWorld(
    true
  );


  box =
    new THREE.Box3()
      .setFromObject(model);


  modelBounds =
    box;


  modelSize =
    box.getSize(
      new THREE.Vector3()
    );


  modelCenter =
    box.getCenter(
      new THREE.Vector3()
    );


  maxModelSize =
    Math.max(
      modelSize.x,
      modelSize.y,
      modelSize.z
    );

}



/* ======================================================
   CAMERA FIT
====================================================== */

function fitCamera() {

  const distance =
    maxModelSize * 1.55;


  perspectiveCamera.near =
    Math.max(
      maxModelSize / 10000,
      .01
    );


  perspectiveCamera.far =
    maxModelSize * 100;


  perspectiveCamera.position.set(
    distance,
    distance * .72,
    distance
  );


  perspectiveCamera
    .updateProjectionMatrix();


  updateOrthoFrustum();


  orthoCamera.position.copy(
    perspectiveCamera.position
  );


  controls.target.copy(
    modelCenter
  );


  controls.update();

}



/* ======================================================
   ORTHOGRAPHIC FRUSTUM
====================================================== */

function updateOrthoFrustum() {

  const aspect =
    window.innerWidth /
    window.innerHeight;


  const half =
    maxModelSize * .72;


  if (aspect >= 1) {

    orthoCamera.left =
      -half * aspect;

    orthoCamera.right =
      half * aspect;

    orthoCamera.top =
      half;

    orthoCamera.bottom =
      -half;

  }

  else {

    orthoCamera.left =
      -half;

    orthoCamera.right =
      half;

    orthoCamera.top =
      half / aspect;

    orthoCamera.bottom =
      -half / aspect;

  }


  orthoCamera.near =
    Math.max(
      maxModelSize / 10000,
      .01
    );


  orthoCamera.far =
    maxModelSize * 100;


  orthoCamera
    .updateProjectionMatrix();

}



/* ======================================================
   CAMERA MODE
====================================================== */

cameraButton.addEventListener(
  "click",
  toggleCamera
);


function toggleCamera() {

  const direction =
    new THREE.Vector3();


  camera.getWorldDirection(
    direction
  );


  const distance =
    camera.position.distanceTo(
      controls.target
    );


  const oldTarget =
    controls.target.clone();


  controls.dispose();


  if (
    cameraMode ===
    "perspective"
  ) {

    cameraMode =
      "orthographic";


    camera =
      orthoCamera;


    updateOrthoFrustum();


    camera.position
      .copy(oldTarget)
      .addScaledVector(
        direction,
        -distance
      );


    camera.lookAt(
      oldTarget
    );


    cameraButton.textContent =
      "Perspective";

  }

  else {

    cameraMode =
      "perspective";


    camera =
      perspectiveCamera;


    camera.position
      .copy(oldTarget)
      .addScaledVector(
        direction,
        -distance
      );


    camera.lookAt(
      oldTarget
    );


    cameraButton.textContent =
      "Axon";

  }


  controls =
    createControls(
      camera
    );


  controls.target.copy(
    oldTarget
  );


  controls.update();

}



/* ======================================================
   EDGES
====================================================== */

function buildEdges() {

  if (edgeGroup)
    scene.remove(
      edgeGroup
    );


  edgeGroup =
    new THREE.Group();


  model.updateMatrixWorld(
    true
  );


  model.traverse(
    object => {

      if (!object.isMesh)
        return;


      const geometry =
        new THREE.EdgesGeometry(
          object.geometry,
          25
        );


      const line =
        new THREE.LineSegments(
          geometry,
          edgeMaterial
        );

line.renderOrder = 11000;

      line.matrixAutoUpdate =
        false;


      line.matrix.copy(
        object.matrixWorld
      );


      edgeGroup.add(
        line
      );

    }
  );


  scene.add(
    edgeGroup
  );


  edgeGroup.visible =
    false;

}



/* ======================================================
   VIEW MODES
====================================================== */

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setViewMode(
            button.dataset.mode
          );

        }
      );

    }
  );


function setViewMode(mode) {

  if (!model)
    return;


  currentMode =
    mode;


  document
    .querySelectorAll(
      "[data-mode]"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.mode === mode
        );

      }
    );


  edgeGroup.visible =
    false;



  /* ---------------------------------------------------
     LIGHTING MODE
  --------------------------------------------------- */


  if (
    mode ===
    "renaissance"
  ) {

    /*
       A kulcs:

       nincs ambient / hemisphere light.

       Csak a nap dönt.
    */

    hemi.intensity =
      0;


    /*
       A külön ShadowMaterial talajsíkon
       a vetett árnyék legyen tiszta fekete.
    */

    if (ground)
      ground.material.opacity =
        1;

  }

  else {

    hemi.intensity =
      DEFAULT_HEMI_INTENSITY;


    if (ground)
      ground.material.opacity =
        .18;

  }



  model.traverse(
    node => {

      if (!node.isMesh)
        return;


      const original =
        originalMaterials.get(
          node.uuid
        );


      switch(mode) {


        /* ----------------------------------------------
           ORIGINAL
        ---------------------------------------------- */

        case "original":

          node.material =
            original;

  node.castShadow =
    true;

          node.visible =
            true;

          break;



        /* ----------------------------------------------
           WHITE
        ---------------------------------------------- */

        case "white":

          node.material =
            whiteMaterial;


  node.castShadow =
    true;

          node.visible =
            true;

          break;



        /* ----------------------------------------------
           HIDDEN LINE
        ---------------------------------------------- */

        case "hidden":

          node.material =
            whiteMaterial;

  node.castShadow =
    true;

          node.visible =
            true;

          edgeGroup.visible =
            true;

          break;



        /* ----------------------------------------------
           WIREFRAME
        ---------------------------------------------- */

        case "wireframe":

          node.material =
            wireMaterial;


  node.castShadow =
    true;

          node.visible =
            true;

          break;



        /* ----------------------------------------------
           RENAISSANCE
        ---------------------------------------------- */

        case "renaissance": {

  const original =
    originalMaterials.get(
      node.uuid
    );


  node.material =
    getRenaissanceMaterial(
      original
    );


  /*
     A teljesen üveg mesh ne vessen
     fekete, tömör árnyékot.
  */

  node.castShadow =
    !isEntirelyGlass(
      original
    );


  node.visible =
    true;

  break;

}

      }

    }
  );


  applyClipping();

}



/* ======================================================
   GROUND
====================================================== */

function createGround() {

  if (ground)
    scene.remove(
      ground
    );


  const geometry =
    new THREE.PlaneGeometry(
      maxModelSize * 10,
      maxModelSize * 10
    );


  const material =
    new THREE.ShadowMaterial({
      color: 0x000000,
      opacity: .18
    });


  ground =
    new THREE.Mesh(
      geometry,
      material
    );


  ground.rotation.x =
    -Math.PI / 2;


  ground.position.set(
    modelCenter.x,
    .001,
    modelCenter.z
  );


  ground.receiveShadow =
    true;


  scene.add(
    ground
  );

}



/* ======================================================
   SUN
====================================================== */

sunAngle.addEventListener(
  "input",
  configureSun
);


sunHeight.addEventListener(
  "input",
  configureSun
);


function configureSun() {

  if (!model)
    return;


  const azimuth =
    THREE.MathUtils.degToRad(
      Number(
        sunAngle.value
      )
    );


  const elevation =
    THREE.MathUtils.degToRad(
      Number(
        sunHeight.value
      )
    );


  const radius =
    maxModelSize * 3;


  const horizontal =
    Math.cos(
      elevation
    ) * radius;


  sun.position.set(

    modelCenter.x +
    Math.cos(
      azimuth
    ) *
    horizontal,

    modelCenter.y +
    Math.sin(
      elevation
    ) *
    radius,

    modelCenter.z +
    Math.sin(
      azimuth
    ) *
    horizontal

  );


  sun.target.position.copy(
    modelCenter
  );


  const extent =
    maxModelSize * .9;


  sun.shadow.camera.left =
    -extent;

  sun.shadow.camera.right =
    extent;

  sun.shadow.camera.top =
    extent;

  sun.shadow.camera.bottom =
    -extent;


  sun.shadow.camera.near =
    maxModelSize * .01;


  sun.shadow.camera.far =
    maxModelSize * 8;


  sun.shadow.camera
    .updateProjectionMatrix();

}

/* ======================================================
   SECTION PLANE
====================================================== */

function updateSectionPlane() {

  if (!modelBounds)
    return;


  const fraction =
    Number(
      sectionSlider.value
    ) /
    1000;


  let min;
  let max;


  const normal =
    new THREE.Vector3();


  if (
    sectionAxis === "x"
  ) {

    min =
      modelBounds.min.x;

    max =
      modelBounds.max.x;

    normal.set(
      -1,
      0,
      0
    );

  }


  if (
    sectionAxis === "y"
  ) {

    min =
      modelBounds.min.y;

    max =
      modelBounds.max.y;

    normal.set(
      0,
      -1,
      0
    );

  }


  if (
    sectionAxis === "z"
  ) {

    min =
      modelBounds.min.z;

    max =
      modelBounds.max.z;

    normal.set(
      0,
      0,
      -1
    );

  }


  if (
    sectionFlip.checked
  ) {

    normal.multiplyScalar(
      -1
    );

  }


  const position =
    THREE.MathUtils.lerp(
      min,
      max,
      fraction
    );


  const point =
    new THREE.Vector3();


  if (
    sectionAxis === "x"
  )
    point.x =
      position;


  if (
    sectionAxis === "y"
  )
    point.y =
      position;


  if (
    sectionAxis === "z"
  )
    point.z =
      position;


  sectionPlane
    .setFromNormalAndCoplanarPoint(
      normal,
      point
    );


  applyClipping();

}



/* ======================================================
   APPLY CLIPPING
====================================================== */

function applyClipping() {

  if (!model)
    return;


  model.traverse(
    node => {

      if (!node.isMesh)
        return;


      const materials =
        Array.isArray(
          node.material
        )
        ? node.material
        : [node.material];


      materials.forEach(
        material => {

          material.clippingPlanes =
            sectionEnabled
            ? [sectionPlane]
            : [];


          material.clipShadows =
            true;


          material.needsUpdate =
            true;

        }
      );

    }
  );


  if (edgeGroup) {

    edgeGroup.traverse(
      node => {

        if (!node.material)
          return;


        node.material.clippingPlanes =
          sectionEnabled
          ? [sectionPlane]
          : [];


        node.material.needsUpdate =
          true;

      }
    );

  }


  scheduleSectionCapRebuild();

}



/* ======================================================
   REAL GEOMETRIC SECTION CAP
====================================================== */

/*
   Drop & View 1.3

   A metszeti kitöltés itt már nem stencil-trükk.

   1. A clipping plane elmetszi a modell háromszögeit.
   2. A háromszög/sík metszésekből 2D szakaszokat gyűjtünk.
   3. A szakaszokból síkbeli zárt kontúrokat építünk.
   4. A kontúrokat (lyukakkal együtt) trianguláljuk.
   5. A létrejövő valódi geometriát piros Meshként rajzoljuk ki.
*/

function scheduleSectionCapRebuild() {

  if (sectionCapFrame !== null)
    return;


  sectionCapFrame =
    requestAnimationFrame(
      () => {

        sectionCapFrame =
          null;

        rebuildSectionCap();

      }
    );

}



function disposeSectionCap() {

  sectionDebugStats.textContent =
    "";


  if (!sectionCapGroup)
    return;


  scene.remove(
    sectionCapGroup
  );


  sectionCapGroup.traverse(
    object => {

      if (object.geometry)
        object.geometry.dispose();

    }
  );


  sectionCapGroup =
    null;

}



function rebuildSectionCap() {

  disposeSectionCap();


  if (
    !sectionEnabled ||
    !model ||
    !modelBounds
  )
    return;


  model.updateMatrixWorld(
    true
  );


  const worldTolerance =
    Math.max(
      maxModelSize * 1e-5,
      1e-6
    );


  const planeOrigin =
    sectionPlane.coplanarPoint(
      new THREE.Vector3()
    );


  const planeNormal =
    sectionPlane.normal
      .clone()
      .normalize();


  /*
     Stabil 2D koordinátarendszer a metszősíkon.
  */
  const helper =
    Math.abs(planeNormal.y) < .9
      ? new THREE.Vector3(0,1,0)
      : new THREE.Vector3(1,0,0);


  const axisU =
    new THREE.Vector3()
      .crossVectors(
        helper,
        planeNormal
      )
      .normalize();


  const axisV =
    new THREE.Vector3()
      .crossVectors(
        planeNormal,
        axisU
      )
      .normalize();


  const pointMap =
    new Map();

  const points2D =
    [];

  const pointComponentIds =
    [];

  const edges =
    new Map();

  const debugEnabled =
    sectionDebug.checked;

  const rawSegmentPositions =
    [];

  const intersectedMeshes =
    new Set();

  const intersectedComponents =
    new Set();


  function pointKey(x,y,componentId) {

    return (
      componentId +
      "|" +
      Math.round(x / worldTolerance) +
      "," +
      Math.round(y / worldTolerance)
    );

  }


  function getPointIndex(
    worldPoint,
    componentId
  ) {

    const delta =
      worldPoint
        .clone()
        .sub(planeOrigin);


    const x =
      delta.dot(axisU);

    const y =
      delta.dot(axisV);


    const key =
      pointKey(
        x,
        y,
        componentId
      );


    if (pointMap.has(key))
      return pointMap.get(key);


    const index =
      points2D.length;


    /*
       A koordinátát a tolerance rácsára pattintjuk.
       Így a szomszédos háromszögek numerikusan picit
       eltérő metszéspontjai biztosan összeérnek.
    */
    const snappedX =
      Math.round(x / worldTolerance) *
      worldTolerance;

    const snappedY =
      Math.round(y / worldTolerance) *
      worldTolerance;


    points2D.push(
      new THREE.Vector2(
        snappedX,
        snappedY
      )
    );


    pointComponentIds.push(
      componentId
    );


    pointMap.set(
      key,
      index
    );


    return index;

  }


  function addSegment(
    a,
    b,
    mesh,
    componentId
  ) {

    if (debugEnabled) {

      rawSegmentPositions.push(
        a.x,a.y,a.z,
        b.x,b.y,b.z
      );


      intersectedMeshes.add(
        mesh
      );


      intersectedComponents.add(
        componentId
      );

    }

    const ia =
      getPointIndex(
        a,
        componentId
      );

    const ib =
      getPointIndex(
        b,
        componentId
      );


    if (ia === ib)
      return;


    const lo =
      Math.min(ia,ib);

    const hi =
      Math.max(ia,ib);

    const key =
      lo + ":" + hi;


    if (!edges.has(key))
      edges.set(
        key,
        [lo,hi]
      );

  }


  const a =
    new THREE.Vector3();

  const b =
    new THREE.Vector3();

  const c =
    new THREE.Vector3();


  const edgeA =
    new THREE.Vector3();

  const edgeB =
    new THREE.Vector3();


  function collectTriangleIntersection(
    p0,
    p1,
    p2,
    plane,
    epsilon,
    matrixWorld,
    mesh,
    componentId
  ) {

    const trianglePoints =
      [];


    const verts =
      [p0,p1,p2];


    for (let i=0; i<3; i++) {

      const p =
        verts[i];

      const q =
        verts[(i+1)%3];


      const dp =
        plane.distanceToPoint(p);

      const dq =
        plane.distanceToPoint(q);


      const pOn =
        Math.abs(dp) <= epsilon;

      const qOn =
        Math.abs(dq) <= epsilon;


      /*
         Ha egy teljes háromszögél a síkban fekszik,
         nem vesszük fel. A szomszédos, valóban metszett
         háromszögek stabilabban definiálják a kontúrt.
      */
      if (pOn && qOn)
        continue;


      let hit =
        null;


      if (pOn) {

        hit =
          p.clone();

      }

      else if (qOn) {

        hit =
          q.clone();

      }

      else if (dp * dq < 0) {

        const t =
          dp / (dp - dq);


        hit =
          p.clone()
            .lerp(q,t);

      }


      if (!hit)
        continue;


      let duplicate =
        false;


      for (const existing of trianglePoints) {

        if (
          existing.distanceToSquared(hit) <=
          epsilon * epsilon
        ) {

          duplicate =
            true;

          break;

        }

      }


      if (!duplicate)
        trianglePoints.push(hit);

    }


    if (trianglePoints.length < 2)
      return;


    /*
       Degenerált esetben a legtávolabbi pontpárt választjuk.
    */
    let bestA =
      0;

    let bestB =
      1;

    let bestDist =
      -1;


    for (let i=0; i<trianglePoints.length; i++) {

      for (let j=i+1; j<trianglePoints.length; j++) {

        const d =
          trianglePoints[i]
            .distanceToSquared(
              trianglePoints[j]
            );


        if (d > bestDist) {

          bestDist =
            d;

          bestA =
            i;

          bestB =
            j;

        }

      }

    }


    edgeA.copy(
      trianglePoints[bestA]
    ).applyMatrix4(
      matrixWorld
    );


    edgeB.copy(
      trianglePoints[bestB]
    ).applyMatrix4(
      matrixWorld
    );


    if (
      edgeA.distanceToSquared(edgeB) >
      worldTolerance * worldTolerance
    )
      addSegment(
        edgeA,
        edgeB,
        mesh,
        componentId
      );

  }


  /* ----------------------------------------------------
     TRIANGLE / PLANE INTERSECTIONS
  ---------------------------------------------------- */

  model.traverse(
    mesh => {

      if (
        !mesh.isMesh ||
        !mesh.geometry?.attributes?.position
      )
        return;


      const geometry =
        mesh.geometry;


      if (!geometry.boundingBox)
        geometry.computeBoundingBox();


      const inverseWorld =
        mesh.matrixWorld
          .clone()
          .invert();


      const localPlane =
        sectionPlane
          .clone()
          .applyMatrix4(
            inverseWorld
          );


      if (
        geometry.boundingBox &&
        !localPlane.intersectsBox(
          geometry.boundingBox
        )
      )
        return;


      const position =
        geometry.attributes.position;

      const index =
        geometry.index;


      const maxScale =
        Math.max(
          mesh.matrixWorld.getMaxScaleOnAxis(),
          1e-9
        );


      const localEpsilon =
        worldTolerance /
        maxScale;


      const triangleCount =
        index
          ? Math.floor(index.count / 3)
          : Math.floor(position.count / 3);

      const triangleComponents =
        sectionTriangleComponents.get(
          mesh
        );


      for (let tri=0; tri<triangleCount; tri++) {

        const ia =
          index
            ? index.getX(tri*3)
            : tri*3;

        const ib =
          index
            ? index.getX(tri*3+1)
            : tri*3+1;

        const ic =
          index
            ? index.getX(tri*3+2)
            : tri*3+2;


        a.fromBufferAttribute(
          position,
          ia
        );

        b.fromBufferAttribute(
          position,
          ib
        );

        c.fromBufferAttribute(
          position,
          ic
        );


        collectTriangleIntersection(
          a,b,c,
          localPlane,
          localEpsilon,
          mesh.matrixWorld,
          mesh,
          triangleComponents?.[tri] ?? -1
        );

      }

    }
  );


  /* ----------------------------------------------------
     DETERMINISTIC T-JUNCTION SPLITTING

     Ha egy már létező metszési végpont egy másik szakasz
     belsejére esik, a hosszabb szakaszt ott kettévágjuk.
     Nem hozunk létre új, becsült pontot: kizárólag a valódi
     háromszög/sík metszések pontjait használjuk.
  ---------------------------------------------------- */

  function splitEdgesAtExistingPoints() {

    if (
      edges.size < 2 ||
      points2D.length < 3
    )
      return 0;


    const indices =
      points2D.map(
        (_,index) => index
      );


    const byX =
      [...indices].sort(
        (ia,ib) =>
          points2D[ia].x -
          points2D[ib].x
      );


    const byY =
      [...indices].sort(
        (ia,ib) =>
          points2D[ia].y -
          points2D[ib].y
      );


    function coordinate(index,useX) {

      return useX
        ? points2D[index].x
        : points2D[index].y;

    }


    function lowerBound(order,value,useX) {

      let low =
        0;

      let high =
        order.length;


      while (low < high) {

        const middle =
          (low + high) >> 1;


        if (
          coordinate(
            order[middle],
            useX
          ) < value
        )
          low = middle + 1;
        else
          high = middle;

      }


      return low;

    }


    const rebuiltEdges =
      new Map();


    function addRebuiltEdge(i,j) {

      if (i === j)
        return;


      const lo =
        Math.min(i,j);

      const hi =
        Math.max(i,j);


      rebuiltEdges.set(
        lo + ":" + hi,
        [lo,hi]
      );

    }


    let splitCount =
      0;


    for (const [start,end] of edges.values()) {

      const p0 =
        points2D[start];

      const p1 =
        points2D[end];


      const dx =
        p1.x - p0.x;

      const dy =
        p1.y - p0.y;

      const lengthSquared =
        dx * dx + dy * dy;


      if (
        lengthSquared <=
        worldTolerance * worldTolerance
      )
        continue;


      /*
         A keskenyebb koordinátatengely szerint keresünk,
         így hosszú vízszintes/függőleges éleknél kevés
         pontot kell megvizsgálni.
      */
      const useX =
        Math.abs(dx) <= Math.abs(dy);

      const order =
        useX ? byX : byY;

      const minCoordinate =
        Math.min(
          useX ? p0.x : p0.y,
          useX ? p1.x : p1.y
        ) - worldTolerance;

      const maxCoordinate =
        Math.max(
          useX ? p0.x : p0.y,
          useX ? p1.x : p1.y
        ) + worldTolerance;


      const cuts = [
        {t: 0,index: start},
        {t: 1,index: end}
      ];


      for (
        let cursor =
          lowerBound(
            order,
            minCoordinate,
            useX
          );
        cursor < order.length;
        cursor++
      ) {

        const pointIndex =
          order[cursor];

        const axisCoordinate =
          coordinate(
            pointIndex,
            useX
          );


        if (axisCoordinate > maxCoordinate)
          break;


        if (
          pointIndex === start ||
          pointIndex === end
        )
          continue;


        const point =
          points2D[pointIndex];


        if (
          point.x < Math.min(p0.x,p1.x) - worldTolerance ||
          point.x > Math.max(p0.x,p1.x) + worldTolerance ||
          point.y < Math.min(p0.y,p1.y) - worldTolerance ||
          point.y > Math.max(p0.y,p1.y) + worldTolerance
        )
          continue;


        const cross =
          dx * (point.y - p0.y) -
          dy * (point.x - p0.x);


        if (
          cross * cross >
          worldTolerance *
          worldTolerance *
          lengthSquared
        )
          continue;


        const t =
          (
            (point.x - p0.x) * dx +
            (point.y - p0.y) * dy
          ) /
          lengthSquared;

        const endpointMargin =
          worldTolerance /
          Math.sqrt(lengthSquared);


        if (
          t <= endpointMargin ||
          t >= 1 - endpointMargin
        )
          continue;


        cuts.push({
          t,
          index: pointIndex
        });

      }


      cuts.sort(
        (aCut,bCut) =>
          aCut.t - bCut.t
      );


      splitCount +=
        cuts.length - 2;


      for (let i=0; i<cuts.length-1; i++) {

        addRebuiltEdge(
          cuts[i].index,
          cuts[i+1].index
        );

      }

    }


    edges.clear();


    for (const [key,value] of rebuiltEdges) {

      edges.set(
        key,
        value
      );

    }


    return splitCount;

  }


  /* ----------------------------------------------------
     PLANAR GRAPH

     A metszési szakaszokból síkbeli gráfot készítünk.
     Directed half-edge bejárással a zárt cellákat kapjuk.
  ---------------------------------------------------- */

  const neighbours =
    Array.from(
      {length: points2D.length},
      () => new Set()
    );


  for (const [i,j] of edges.values()) {

    neighbours[i].add(j);
    neighbours[j].add(i);

  }


  let degrees =
    [];

  let degree1Count =
    0;

  let branchCount =
    0;

  let openChainCount =
    0;


  if (debugEnabled) {

    degrees =
      neighbours.map(
        set => set.size
      );


    degree1Count =
      degrees.filter(
        degree => degree === 1
      ).length;


    branchCount =
      degrees.filter(
        degree => degree > 2
      ).length;


    /*
       Open chains are maximal graph paths whose ends are not
       ordinary degree-2 continuation nodes. This is diagnostic
       only; it does not repair or modify the graph.
    */
    const openChainEdges =
      new Set();


    function undirectedKey(i,j) {

      return Math.min(i,j) + ":" + Math.max(i,j);

    }


    for (let start=0; start<neighbours.length; start++) {

      if (degrees[start] === 2)
        continue;


      for (const first of neighbours[start]) {

        const firstKey =
          undirectedKey(start,first);


        if (openChainEdges.has(firstKey))
          continue;


        openChainCount++;


        let previous =
          start;

        let current =
          first;


        openChainEdges.add(firstKey);


        while (degrees[current] === 2) {

          const next =
            [...neighbours[current]].find(
              index => index !== previous
            );


          if (next === undefined)
            break;


          const nextKey =
            undirectedKey(current,next);


          if (openChainEdges.has(nextKey))
            break;


          openChainEdges.add(nextKey);

          previous =
            current;

          current =
            next;

        }

      }

    }

  }


  const sortedNeighbours =
    neighbours.map(
      (set,index) => {

        const p =
          points2D[index];


        return [...set].sort(
          (ia,ib) => {

            const aPoint =
              points2D[ia];

            const bPoint =
              points2D[ib];


            const aa =
              Math.atan2(
                aPoint.y - p.y,
                aPoint.x - p.x
              );

            const ab =
              Math.atan2(
                bPoint.y - p.y,
                bPoint.x - p.x
              );


            return aa - ab;

          }
        );

      }
    );


  const directedVisited =
    new Set();


  function directedKey(i,j) {
    return i + ">" + j;
  }


  const loops =
    [];


  for (const [edgeI,edgeJ] of edges.values()) {

    for (const [startA,startB] of [
      [edgeI,edgeJ],
      [edgeJ,edgeI]
    ]) {

      const startKey =
        directedKey(
          startA,
          startB
        );


      if (directedVisited.has(startKey))
        continue;


      const loopIndices =
        [];


      let previous =
        startA;

      let current =
        startB;

      let closed =
        false;


      const safetyLimit =
        edges.size * 2 + 10;


      for (let safety=0; safety<safetyLimit; safety++) {

        directedVisited.add(
          directedKey(
            previous,
            current
          )
        );


        loopIndices.push(
          previous
        );


        const list =
          sortedNeighbours[current];


        if (!list || list.length === 0)
          break;


        const incomingIndex =
          list.indexOf(
            previous
          );


        if (incomingIndex < 0)
          break;


        /*
           Az előző élhez képest az óramutató járásával
           megegyező legközelebbi él tartja a cellát balra.
        */
        const next =
          list[
            (
              incomingIndex - 1 +
              list.length
            ) % list.length
          ];


        previous =
          current;

        current =
          next;


        if (
          previous === startA &&
          current === startB
        ) {

          closed =
            true;

          break;

        }

      }


      if (!closed)
        continue;


      const polygon =
        loopIndices.map(
          index =>
            points2D[index].clone()
        );


      if (polygon.length < 3)
        continue;


      /*
         Egymás utáni kollineáris pontok ritkítása.
      */
      const cleaned =
        [];


      for (let i=0; i<polygon.length; i++) {

        const prev =
          polygon[
            (i - 1 + polygon.length) %
            polygon.length
          ];

        const here =
          polygon[i];

        const next =
          polygon[
            (i + 1) %
            polygon.length
          ];


        const v1x =
          here.x - prev.x;

        const v1y =
          here.y - prev.y;

        const v2x =
          next.x - here.x;

        const v2y =
          next.y - here.y;


        const cross =
          v1x * v2y -
          v1y * v2x;


        if (
          Math.abs(cross) >
          worldTolerance * worldTolerance
        )
          cleaned.push(
            here
          );

      }


      if (cleaned.length < 3)
        continue;


      const area =
        THREE.ShapeUtils.area(
          cleaned
        );


      /*
         A half-edge bejárás minden határt kétszer talál meg.
         Csak a pozitív orientációjú cellákat tartjuk meg.
      */
      if (
        area >
        worldTolerance * worldTolerance * 4
      )
        loops.push(
          {
            points: cleaned,
            componentId:
              pointComponentIds[
                loopIndices[0]
              ]
          }
        );

    }

  }


  function pointInPolygon(point,polygon) {

    let inside =
      false;


    for (
      let i=0,j=polygon.length-1;
      i<polygon.length;
      j=i++
    ) {

      const pi =
        polygon[i];

      const pj =
        polygon[j];


      const intersects =
        (
          (pi.y > point.y) !==
          (pj.y > point.y)
        ) &&
        (
          point.x <
          (pj.x - pi.x) *
          (point.y - pi.y) /
          (pj.y - pi.y) +
          pi.x
        );


      if (intersects)
        inside =
          !inside;

    }


    return inside;

  }


  function interiorPoint(loop) {

    const triangles =
      THREE.ShapeUtils.triangulateShape(
        loop,
        []
      );


    if (triangles.length) {

      const tri =
        triangles[0];


      return new THREE.Vector2(
        (
          loop[tri[0]].x +
          loop[tri[1]].x +
          loop[tri[2]].x
        ) / 3,
        (
          loop[tri[0]].y +
          loop[tri[1]].y +
          loop[tri[2]].y
        ) / 3
      );

    }


    return loop[0].clone();

  }


  const loopData =
    loops.map(
      entry => ({
        loop: entry.points,
        componentId:
          entry.componentId,
        sample: interiorPoint(
          entry.points
        ),
        area: Math.abs(
          THREE.ShapeUtils.area(
            entry.points
          )
        ),
        depth: 0,
        parent: -1
      })
    );


  /*
     Páros nesting depth = kitöltött sziget.
     Páratlan depth       = lyuk.
  */
  for (let i=0; i<loopData.length; i++) {

    let depth =
      0;

    let parent =
      -1;

    let parentArea =
      Infinity;


    for (let j=0; j<loopData.length; j++) {

      if (i === j)
        continue;


      if (
        loopData[j].componentId !==
        loopData[i].componentId
      )
        continue;


      if (
        loopData[j].area <=
        loopData[i].area
      )
        continue;


      if (
        pointInPolygon(
          loopData[i].sample,
          loopData[j].loop
        )
      ) {

        depth++;


        if (
          loopData[j].area <
          parentArea
        ) {

          parent =
            j;

          parentArea =
            loopData[j].area;

        }

      }

    }


    loopData[i].depth =
      depth;

    loopData[i].parent =
      parent;

  }


  const positions =
    [];


  function worldFrom2D(point) {

    return planeOrigin
      .clone()
      .addScaledVector(
        axisU,
        point.x
      )
      .addScaledVector(
        axisV,
        point.y
      );

  }


  for (let i=0; i<loopData.length; i++) {

    const outerData =
      loopData[i];


    if (outerData.depth % 2 !== 0)
      continue;


    let contour =
      outerData.loop.map(
        p => p.clone()
      );


    if (
      !THREE.ShapeUtils.isClockWise(
        contour
      )
    )
      contour.reverse();


    const holes =
      [];


    for (let h=0; h<loopData.length; h++) {

      const holeData =
        loopData[h];


      if (
        holeData.componentId !==
        outerData.componentId
      )
        continue;


      if (
        holeData.depth !==
        outerData.depth + 1
      )
        continue;


      if (
        holeData.parent !== i
      )
        continue;


      const hole =
        holeData.loop.map(
          p => p.clone()
        );


      if (
        THREE.ShapeUtils.isClockWise(
          hole
        )
      )
        hole.reverse();


      holes.push(
        hole
      );

    }


    const triangles =
      THREE.ShapeUtils.triangulateShape(
        contour,
        holes
      );


    const allPoints =
      contour.concat(
        ...holes
      );


    for (const triangle of triangles) {

      for (const index of triangle) {

        const worldPoint =
          worldFrom2D(
            allPoints[index]
          );


        positions.push(
          worldPoint.x,
          worldPoint.y,
          worldPoint.z
        );

      }

    }

  }


  sectionCapGroup =
    new THREE.Group();


  if (positions.length > 0) {

    const geometry =
      new THREE.BufferGeometry();


    geometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        positions,
        3
      )
    );


    const capMesh =
      new THREE.Mesh(
        geometry,
        sectionCapMaterial
      );


    capMesh.renderOrder =
      10500;

    capMesh.castShadow =
      false;

    capMesh.receiveShadow =
      false;

    capMesh.raycast =
      () => {};


    sectionCapGroup.add(
      capMesh
    );

  }


  if (debugEnabled) {

    const rawGeometry =
      new THREE.BufferGeometry();


    rawGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        rawSegmentPositions,
        3
      )
    );


    const rawLines =
      new THREE.LineSegments(
        rawGeometry,
        sectionDebugLineMaterial
      );


    rawLines.renderOrder =
      10510;

    rawLines.raycast =
      () => {};


    sectionCapGroup.add(
      rawLines
    );


    const pointPositions = [[],[],[]];


    for (let i=0; i<points2D.length; i++) {

      const degree =
        degrees[i];


      const groupIndex =
        degree === 1
        ? 1
        : degree > 2
          ? 2
          : 0;


      const worldPoint =
        worldFrom2D(
          points2D[i]
        );


      pointPositions[groupIndex].push(
        worldPoint.x,
        worldPoint.y,
        worldPoint.z
      );

    }


    const pointMaterials = [
      sectionDebugDegree2Material,
      sectionDebugDegree1Material,
      sectionDebugBranchMaterial
    ];


    for (let i=0; i<pointPositions.length; i++) {

      if (pointPositions[i].length === 0)
        continue;


      const pointGeometry =
        new THREE.BufferGeometry();


      pointGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
          pointPositions[i],
          3
        )
      );


      const pointCloud =
        new THREE.Points(
          pointGeometry,
          pointMaterials[i]
        );


      pointCloud.renderOrder =
        10520;

      pointCloud.raycast =
        () => {};


      sectionCapGroup.add(
        pointCloud
      );

    }


    sectionDebugStats.textContent =
      [
        `intersected meshes  ${intersectedMeshes.size}`,
        `surface components  ${sectionTopologyComponentCount}`,
        `cut components      ${intersectedComponents.size}`,
        `raw segments        ${rawSegmentPositions.length / 6}`,
        `graph edges         ${edges.size}`,
        `graph nodes         ${points2D.length}`,
        `closed loops        ${loops.length}`,
        `cap triangles       ${positions.length / 9}`,
        `open chains         ${openChainCount}`,
        `degree-1 nodes      ${degree1Count}`,
        `degree >2 nodes     ${branchCount}`
      ].join("\n");

  }


  scene.add(
    sectionCapGroup
  );

}



/* ======================================================
   MODEL INSPECTOR
====================================================== */

function inspectModel(file) {

  let meshCount =
    0;

  let triangleCount =
    0;

  let vertexCount =
    0;


  const materials =
    new Map();

  model.traverse(
    node => {

      if (!node.isMesh)
        return;


      meshCount++;


      const geometry =
        node.geometry;


      if (
        geometry.attributes.position
      ) {

        vertexCount +=
          geometry
            .attributes
            .position
            .count;

      }


      if (
        geometry.index
      ) {

        triangleCount +=
          geometry.index.count /
          3;

      }

      else if (
        geometry.attributes.position
      ) {

        triangleCount +=
          geometry
            .attributes
            .position
            .count /
          3;

      }


      const mats =
        Array.isArray(
          node.material
        )
        ? node.material
        : [node.material];


      mats.forEach(
        material => {

          if (!material)
            return;


          const name =
            material.name ||
            "(unnamed)";


          materials.set(
            name,
            (
              materials.get(
                name
              ) || 0
            ) + 1
          );

        }
      );

    }
  );


  const mb =
    file.size /
    1024 /
    1024;


  modelStats.innerHTML =
    `

    <div class="model-stat">
      <span>File</span>
      <span>${escapeHTML(file.name)}</span>
    </div>

    <div class="model-stat">
      <span>Size</span>
      <span>${mb.toFixed(1)} MB</span>
    </div>

    <div class="model-stat">
      <span>Meshes</span>
      <span>${meshCount.toLocaleString()}</span>
    </div>

    <div class="model-stat">
      <span>Vertices</span>
      <span>${Math.round(vertexCount).toLocaleString()}</span>
    </div>

    <div class="model-stat">
      <span>Triangles</span>
      <span>${Math.round(triangleCount).toLocaleString()}</span>
    </div>

    <div class="model-stat">
      <span>Materials</span>
      <span>${materials.size}</span>
    </div>

    `;


  materialList.innerHTML =
    "";


  [...materials.entries()]
    .sort(
      (a,b) =>
        a[0].localeCompare(
          b[0],
          "hu"
        )
    )
    .forEach(
      ([name,count]) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "material-item";


        item.textContent =
          `${name} · ${count}`;


        materialList.appendChild(
          item
        );

      }
    );

}



/* ======================================================
   DOUBLE CLICK FOCUS
====================================================== */

const raycaster =
  new THREE.Raycaster();


const pointer =
  new THREE.Vector2();


renderer.domElement.addEventListener(
  "dblclick",
  event => {

    if (!model)
      return;


    const rect =
      renderer.domElement
        .getBoundingClientRect();


    pointer.x =
      (
        (
          event.clientX -
          rect.left
        ) /
        rect.width
      ) * 2 - 1;


    pointer.y =
      -(
        (
          event.clientY -
          rect.top
        ) /
        rect.height
      ) * 2 + 1;


    raycaster.setFromCamera(
      pointer,
      camera
    );


    const hits =
      raycaster.intersectObject(
        model,
        true
      );


    if (
      hits.length
    ) {

      animateTarget(
        hits[0].point
      );

    }

  }
);



/* ======================================================
   SMOOTH TARGET
====================================================== */

function animateTarget(
  destination
) {

  const start =
    controls.target.clone();


  const startTime =
    performance.now();


  const duration =
    350;


  function step(now) {

    let t =
      (
        now -
        startTime
      ) /
      duration;


    t =
      Math.min(
        1,
        t
      );


    t =
      1 -
      Math.pow(
        1 - t,
        3
      );


    controls.target
      .lerpVectors(
        start,
        destination,
        t
      );


    if (
      t < 1
    ) {

      requestAnimationFrame(
        step
      );

    }

  }


  requestAnimationFrame(
    step
  );

}



/* ======================================================
   PANEL
====================================================== */

panelButton.addEventListener(
  "click",
  () => {

    sidePanel.classList.toggle(
      "hidden"
    );


    panelButton.classList.toggle(
      "active"
    );

  }
);



/* ======================================================
   DISPOSE MODEL
====================================================== */

function disposeCurrentModel() {

  if (!model)
    return;


if (sectionCapFrame !== null) {
    cancelAnimationFrame(sectionCapFrame);
    sectionCapFrame = null;
  }

  disposeSectionCap();
  scene.remove(
    model
  );


  model.traverse(
    node => {

      if (!node.isMesh)
        return;


      node.geometry?.dispose();


      const materials =
        Array.isArray(
          node.material
        )
        ? node.material
        : [node.material];


      materials.forEach(
        material => {

          if (!material)
            return;


          /*
             A megosztott viewer-materialokat
             nem akarjuk itt eldobni.
          */

          if (
            material === whiteMaterial ||
            material === wireMaterial ||
            material === renaissanceMaterial ||
            material === renaissanceGlassMaterial ||
            material === sectionCapMaterial
          )
            return;


          material.map?.dispose();

          material.dispose();

        }
      );

    }
  );


  if (edgeGroup) {

    scene.remove(
      edgeGroup
    );

    edgeGroup =
      null;

  }


  if (ground) {

    scene.remove(
      ground
    );


    ground.geometry.dispose();

    ground.material.dispose();


    ground =
      null;

  }


  if (
    currentObjectURL
  ) {

    URL.revokeObjectURL(
      currentObjectURL
    );


    currentObjectURL =
      null;

  }


  originalMaterials.clear();
  
  originalCastShadow.clear();


  sectionTriangleComponents =
    new WeakMap();

  sectionTopologyComponentCount =
    0;


  model =
    null;

}



/* ======================================================
   STATUS
====================================================== */

function setStatus(text) {

  statusElement.textContent =
    text;


  statusElement.style.opacity =
    "1";


  clearTimeout(
    setStatus.timeout
  );


  setStatus.timeout =
    setTimeout(
      () => {

        statusElement.style.opacity =
          ".38";

      },
      5000
    );

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(
  "resize",
  () => {

    const width =
      window.innerWidth;

    const height =
      window.innerHeight;


    perspectiveCamera.aspect =
      width /
      height;


    perspectiveCamera
      .updateProjectionMatrix();


    updateOrthoFrustum();


    renderer.setSize(
      width,
      height
    );

  }
);



/* ======================================================
   RENDER LOOP
====================================================== */

function animate() {

  controls.update();


  renderer.render(
    scene,
    camera
  );

}


renderer.setAnimationLoop(
  animate
);

</script>
